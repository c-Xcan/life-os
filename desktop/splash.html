<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
<title>Life OS</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #737373; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  img { width: 64px; height: 64px; border-radius: 16px; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .t { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .s { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: b 1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s } .dot:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
</style>
</head>
<body>
  <img src="build/icon.png" alt="" />
  <div class="t">Life OS</div>
  <div class="s">正在启动 <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</body>
</html>
